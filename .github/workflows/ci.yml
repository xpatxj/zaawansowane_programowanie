name: ci

on:
  push:
    branches: ['**']

jobs:
  pycodestyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: instalacja pycodestyle
        run: pip install pycodestyle
      - name: sprawdzenie kodu
        run: pycodestyle .